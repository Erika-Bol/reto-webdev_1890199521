<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero - Reto Maestro Detalle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .badge-ok { background-color: #198754; color: #fff; }
    .badge-no { background-color: #6c757d; color: #fff; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Control de Misiones - UMG</h3>
      <div>
        <a href="http://52.171.58.51:8080/" target="_blank" class="btn btn-outline-primary btn-sm me-2">Evaluador Central</a>
        <button class="btn btn-success btn-sm" onclick="cargarEstudiantes()">Refrescar</button>
      </div>
    </div>

    <!-- Panel de Envío -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-dark text-white fw-semibold">Probar Envío POST (/api/registro)</div>
      <div class="card-body row">
        <div class="col-md-6 mb-2">
          <label class="form-label fw-bold">JSON:</label>
          <textarea id="jsonInput" class="form-control font-monospace" rows="8">{
  "maestro": {
    "carnet": "1890-19-9521",
    "nombre": "Erika Esmeralda Argentina Bol Cruz",
    "correo": "ebolc4@miumg.edu.gt"
  },
  "detalle": [
    { "misionId": 1, "estado": true },
    { "misionId": 2, "estado": false },
    { "misionId": 3, "estado": true }
  ]
}</textarea>
        </div>
        <div class="col-md-6 mb-2">
          <label class="form-label fw-bold">Respuesta:</label>
          <pre id="jsonOutput" class="p-3 bg-secondary text-white rounded font-monospace" style="height: 180px; overflow-y: auto;">Sin peticiones aún...</pre>
          <button class="btn btn-primary w-100" onclick="enviarRegistro()">Enviar Registro</button>
        </div>
      </div>
    </div>

    <!-- Tablero de Avance -->
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white fw-semibold">Avance de Estudiantes</div>
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Carnet</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Progreso</th>
              <th>Misiones</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo">
            <tr><td colspan="5" class="text-center">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://.azurewebsites.net';

    async function cargarEstudiantes() {
      const tbody = document.getElementById('tablaCuerpo');
      try {
        const res = await fetch(`${API_BASE_URL}/api/estudiantes`);
        const lista = await res.json();
        if (!lista.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay registros.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        lista.forEach(e => {
          const total = e.misiones.length;
          const ok = e.misiones.filter(m => m.estado).length;
          const pct = total ? Math.round((ok / total) * 100) : 0;

          const badges = e.misiones.map(m => `
            <span class="badge ${m.estado ? 'badge-ok' : 'badge-no'} me-1 mb-1">
              ${m.misionId}: ${m.estado ? '✓' : '✗'}
            </span>
          `).join('');

          tbody.innerHTML += `
            <tr>
              <td><code>${e.carnet}</code></td>
              <td>${e.nombre}</td>
              <td>${e.correo}</td>
              <td style="min-width: 140px;">
                <div class="progress mb-1" style="height: 16px;">
                  <div class="progress-bar bg-success" style="width: ${pct}%;">${pct}%</div>
                </div>
                <small class="text-muted">${ok}/${total} misiones</small>
              </td>
              <td>${badges}</td>
            </tr>
          `;
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error: ${err.message}</td></tr>`;
      }
    }

    async function enviarRegistro() {
      const output = document.getElementById('jsonOutput');
      output.innerText = 'Enviando...';
      try {
        const res = await fetch(`${API_BASE_URL}/api/registro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: document.getElementById('jsonInput').value
        });
        const data = await res.json();
        output.innerText = JSON.stringify(data, null, 2);
        if (res.ok) cargarEstudiantes();
      } catch (err) {
        output.innerText = `Error: ${err.message}`;
      }
    }

    document.addEventListener('DOMContentLoaded', cargarEstudiantes);
  </script>
</body>
</html>
